<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guardian Panel - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* Custom styles */
        body {
            background-color: #111827; /* bg-gray-900 */
            color: #d1d5db; /* text-gray-300 */
        }
        .sidebar {
            transition: transform 0.3s ease-in-out;
        }
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
            }
            .sidebar.active {
                transform: translateX(0);
            }
        }
        .toast-container {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 50;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .toast {
            display: flex;
            align-items: center;
            padding: 1rem;
            border-radius: 0.375rem; /* rounded-md */
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); /* shadow-lg */
            color: white;
            min-width: 250px;
        }
        .toast.success { background-color: #10b981; /* bg-green-500 */ }
        .toast.error { background-color: #ef4444; /* bg-red-500 */ }
        .toast.warning { background-color: #f59e0b; /* bg-yellow-500 */ }
        .toast.info { background-color: #3b82f6; /* bg-blue-500 */ }
        .toast-icon { margin-right: 0.75rem; /* mr-3 */ }
        .toast-content { flex-grow: 1; }
        .toast-title { font-weight: 600; /* font-semibold */ }
        .loading-overlay {
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        /* Notification styles */
        .notification-item {
            border-left-width: 4px;
            padding: 0.75rem 1rem;
        }
        .notification-item.connect { border-color: #10b981; /* border-green-500 */ }
        .notification-item.disconnect { border-color: #f59e0b; /* border-yellow-500 */ }
        .notification-item.file { border-color: #3b82f6; /* border-blue-500 */ }
        .notification-item.text { border-color: #6366f1; /* border-indigo-500 */ }
        .notification-item.location { border-color: #a855f7; /* border-purple-500 */ }
        .notification-item.settings { border-color: #84cc16; /* border-lime-500 */ }
        .notification-item.command_sent { border-color: #06b6d4; /* border-cyan-500 */ }
        .notification-item.error { border-color: #ef4444; /* border-red-500 */ }
    </style>
</head>

        // Format date utility
        function formatNotificationTimestamp(isoString) {
            const date = new Date(isoString);
            return date.toLocaleString(undefined, { dateStyle: 'short', timeStyle: 'medium' });
        }

        // Render single notification item
        function renderNotificationItem(notification) {
            const item = document.createElement('div');
            item.className = `notification-item bg-gray-700 rounded-md notification-item ${notification.type}`;
            item.innerHTML = `
                <div class="flex justify-between text-xs text-gray-400 mb-1">
                    <span>${notification.model} (${notification.type})</span>
                    <span>${formatNotificationTimestamp(notification.timestamp)}</span>
                </div>
                <p class="text-sm text-gray-200">${notification.content}</p>
            `;
            return item;
        }

        // Update notification list display
        function updateNotificationList(notifications) {
            const listElement = document.getElementById('notificationList');
            const noNotifText = document.getElementById('noNotificationsText');
            if (!listElement || !noNotifText) return;

            listElement.innerHTML = ''; // Clear existing
            if (notifications && notifications.length > 0) {
                noNotifText.classList.add('hidden');
                notifications.forEach(notif => {
                    listElement.appendChild(renderNotificationItem(notif));
                });
            } else {
                noNotifText.classList.remove('hidden');
                noNotifText.textContent = 'No notifications yet.';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const notificationSection = document.getElementById('notificationHistorySection');
            const notificationToggles = document.querySelectorAll('#notificationHistoryToggle, #notificationHistoryToggleMobile');
            const closeButton = document.getElementById('closeNotificationHistory');
            const notificationListElement = document.getElementById('notificationList');

            // Toggle notification section visibility
            notificationToggles.forEach(toggle => {
                toggle.addEventListener('click', (e) => {
                    e.preventDefault();
                    notificationSection.classList.toggle('hidden');
                    // Fetch history when opened
                    if (!notificationSection.classList.contains('hidden')) {
                        if (socket && isConnected) {
                            socket.emit('get_notifications');
                        } else {
                            // Fallback fetch via API
                            fetch('/api/notifications')
                                .then(res => res.ok ? res.json() : Promise.reject(res))
                                .then(data => {
                                    if (data.success) {
                                        updateNotificationList(data.notifications);
                                    } else {
                                        console.error('Failed to fetch notifications via API');
                                        notificationListElement.innerHTML = '<p class="text-red-500 text-center">Failed to load notifications.</p>';
                                    }
                                })
                                .catch(err => {
                                    console.error('Error fetching notifications via API:', err);
                                    notificationListElement.innerHTML = '<p class="text-red-500 text-center">Error loading notifications.</p>';
                                });
                        }
                    }
                });
            });

            // Close notification section
            if (closeButton) {
                closeButton.addEventListener('click', () => {
                    notificationSection.classList.add('hidden');
                });
            }

            // Socket listeners for notifications (should be in main.js or initialized there)
            if (typeof socket !== 'undefined') {
                socket.on('notification_history', (history) => {
                    updateNotificationList(history);
                });

                    // Add to top if section is visible
                    if (!notificationSection.classList.contains('hidden')) {
                        const listElement = document.getElementById('notificationList');
                        const noNotifText = document.getElementById('noNotificationsText');
                        if (listElement) {
                            listElement.insertBefore(renderNotificationItem(notification), listElement.firstChild);
                            if (noNotifText) noNotifText.classList.add('hidden');

                            // while (listElement.children.length > MAX_HISTORY_LENGTH) {

                            // }
                        }
                    }
                    // Show toast for new notification
                    showToast(notification.type, `Notification: ${notification.model}`, notification.content.substring(0, 50) + '...');
                });
            }
